<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Orders</title>
    <link rel="stylesheet" href="app.css"/>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1> Shop to do Orders</h1>
        <div id="message" role="status" aria-live="polite"></div>
        <section>
            <h2> All Products</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product ID</th>
                            <th> Name</th>
                            <th> Price</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2> Create Order</h2>
            <form id="createOrder">
                <label for="orderId"> OrderId</label>
                <input type="number" id="orderId" min="1" step="1" required />
                <label for="consumer">Name</label>
                <input type="text" id="consumer" required />
                <button type="submit">Create order</button>
                <button type="button" id="addRows">Add product</button>
                <div id="addProducts">

                </div>
            </form>

        </section>
        <section>
            <h2>Show all orders</h2>
            <button type="button" id="showAllOrders"> Show all orders</button>
            <table id="allOrdersTable">
                <thead>
                    <tr>
                        <th> ID</th>
                        <th> ClientName</th>
                        <th> Date</th>
                        <th> Total</th>
                        <th> TotalOfProducts</th>
                    </tr>
                </thead>
                <tbody id="listAllOrders">
                </tbody>
            </table>

        </section>
        <section>
            <h2>Show order by id</h2>

            <form>
                <label for="searchOrderId">OrderId</label>

                <input type="number" id="searchOrderId" min="1" step="1" required />
                <button type="button" id="showOrderById">Show order by id</button>
            </form>

            <table id="OrderTable">
                <thead>
                    <tr>
                        <th> ID</th>
                        <th> ClientName</th>
                        <th> Date</th>
                        <th> Total</th>
                        <th> TotalOfProducts</th>
                    </tr>
                </thead>
                <tbody id="listOrderById">
                </tbody>
            </table>
        </section>
        <section>
            <h2> UpdateOrder</h2>
            <form id="updateOrder">
                <label for="OrderId"> OldOrderId</label>
                <input type="number" id="oldId" min="1" step="1" required />
                <label for="OrderId"> NewOrderId</label>
                <input type="number" id="updateOrderId" min="1" step="1" required />
                <label for="consumer">Name</label>
                <input type="text" id="updateConsumer" required />
                <button type="submit" id="UpdateOrder">UpdateOrder</button>
                <button type="button" id="addRowsToUpdateOrder">Add product</button>
                <div id="updateProducts">

                </div>
            </form>
        </section>
        <section>
           <h2> Delete Order by Id</h2>
            <label for="deleteOrderId"></label>
            <input type="number" id="deleteId" min="1" step="1" required></input>
            <button type="button" id="deleteButton"> Delete order</button>
        </section>

    </main>
    
    
</body>
</html>
